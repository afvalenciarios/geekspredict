<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        }

        .logo {
            background: #2563eb;
            color: white;
            width: 50px;
            height: 50px;
            margin: 0 auto 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        h2 {
            margin: 0;
        }

        .subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e4fd6;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">G</div>

    <h2>Geeks Technology</h2>
    <div class="subtitle">Analítica Predictiva de Ventas</div>

    <form method="POST">
        {% csrf_token %}
        {% if form.errors %}
            <p style="color:red; font-size:13px;">
            Usuario o contraseña incorrectos.
            </p>
        {% endif %}
        <input type="text" name="username" placeholder="Acceso corporativo" required>

        <input type="password" name="password" placeholder="Contraseña" required>

        <button type="submit">ENTRAR AL SISTEMA</button>
    </form>

</div>

</body>
</html>
